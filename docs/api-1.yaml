  /share/reminder:
    post:
      summary: Send reminders for shared documents
      description: >-
        This endpoint sends reminder notifications to recipients of shared
        documents who have pending actions.


        The endpoint provides several capabilities:

        1. Send a reminder for a specific share by providing its ID

        2. Send reminders for all eligible shares of a document by providing the
        document ID

        3. Automatically enforce reminder frequency limits to prevent
        notification spam


        Reminders are useful for:

        - Following up with recipients who haven't completed their required
        actions

        - Nudging signers who may have forgotten about pending signature
        requests

        - Improving document workflow completion rates

        - Reducing the time to complete multi-party document processes


        Note: This endpoint has several built-in protections to ensure
        appropriate use of reminders:

        - Reminders can only be sent for shares that require action (sign,
        approve, review)

        - Reminders cannot be sent for shares that have already been completed

        - Reminders are limited to once per day for each share

        - Only document owners or original sharers can send reminders

        - Reminders using SMS reminder type are only usable with individual
        shares provided because they require a phone number


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestSharesPostReminder
      tags:
        - Share
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestSharesPostReminder"
      responses:
        "200":
          description: Reminder notifications were successfully sent to eligible recipients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
