        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[add_users]`


        **Required user role:** `admin or organization_admin`
      operationId: requestUsersPostUser
      tags:
        - Users
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestUsersPostUser"
      responses:
        "200":
          description: Returns details about unsuccessful user creation operations, other
            users were created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericBulk"
        "400":
          description: Invalid request format, missing required fields, or invalid user
            data.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to create users.
  /webhooks/{id}:
    delete:
      summary: Delete a webhook
      description: >-
        This endpoint permanently removes a webhook from the Circularo system.


        The endpoint allows you to:

        1. Delete a specific webhook by its unique identifier

        2. Stop receiving webhook event notifications at the associated callback
        URL

        3. Clean up unused or outdated webhook configurations


        Webhooks in Circularo allow external systems to:

        - Receive real-time notifications about document events

        - Integrate with third-party systems for workflow automation

        - Track document status changes (creation, signing, completion)


        When a webhook is deleted:

        - The system stops sending notifications to the associated callback URL

        - The webhook configuration is permanently removed from the system


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_webhooks]`


        **Required user role:** `admin or organization_admin`
      operationId: requestWebhooksDeleteWebhook
      tags:
        - Webhooks
      security:
        - Token: []
      parameters:
        - in: path
          name: id
          description: Unique identifier of the webhook to delete. This ID is returned
            when creating webhooks or listing webhooks.
          required: true
          schema:
            type: string
            minLength: 1
            example: as5Va0dUP6asH0asd95f
      responses:
        "200":
          description: The webhook was successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
          description: Invalid request format or parameters.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to delete webhooks. Only administrators
            can delete webhooks.
        "404":
          description: Webhook not found. The specified ID does not correspond to any
            webhook accessible by the user.
  /webhooks:
    get:
      summary: List available webhooks
      description: >-
        This endpoint retrieves a list of webhooks configured in the Circularo
        system.


        The endpoint provides several capabilities:

        1. List all webhooks accessible to the current user

        2. Paginate through large result sets

        3. View webhook configuration details including callback URLs


        Webhooks in Circularo allow external systems to:

        - Receive real-time notifications about document events

        - Integrate with third-party systems for workflow automation

        - Track document status changes (creation, signing, completion)


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_webhooks]`


        **Required user role:** `admin or organization_admin`
      operationId: requestWebhooksGetWebhooks
      tags:
        - Webhooks
      security:
        - Token: []
      parameters:
        - in: query
          name: from
          description: Starting position in the result set.
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: false
            nullable: true
        - in: query
          name: organizations
          description: "For system administrators only: Filter webhooks by organization
            name. Can be a single organization name or an array of organization
            names. Organization administrators cannot use this parameter as they
            are automatically limited to their own organization."
          required: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: size
          description: Maximum number of results to return.
          required: false
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: false
            maximum: 100
            exclusiveMaximum: false
            example: 10
            default: 10
            nullable: true
      responses:
        "200":
          description: Returns a list of webhooks accessible to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseWebhooksMultiple"
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to view webhooks.
    post:
      summary: Create a new webhook
      description: |-
        This endpoint creates a new webhook in the Circularo system.

        Webhooks in Circularo allow external systems to:
        - Receive real-time notifications about document events
        - Integrate with third-party systems for workflow automation
        - Track document status changes (creation, signing, completion)

        ---



        **Token authorization:** Authorize using token to call this endpoint.

        **Required user rights:** `[use_webhooks]`

        **Required user role:** `admin or organization_admin`
      operationId: requestWebhooksPostWebhook
      tags:
        - Webhooks
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestWebhooksPostWebhook"
      responses:
        "200":
          description: Returns the details of the newly created webhook, including its ID
            and configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseWebhooksSingle"
        "400":
          description: Invalid request format, missing required fields, or invalid webhook
            type.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to create webhooks.
        "404":
          description: The specified organization was not found.
