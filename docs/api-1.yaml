        - signedFiles
    requestSharesShareData:
      type: object
      properties:
        allowedOAuths:
          type: array
          items:
            type: string
          description: Allowed OAuth providers to verify the user (only for external
            recipients; protection method).
          nullable: true
        automaticReminder:
          allOf:
            - $ref: "#/components/schemas/entitySharesAutomaticReminder"
          description: Configuration for automatic reminders. If provided, the system will
            automatically send reminder notifications to the recipient based on
            the specified schedule.
          nullable: true
        isMandatory:
          type: boolean
          description: Is this share required to be completed for successful share workflow.
          example: true
          default: true
        kycFactors:
          type: array
          items:
            type: string
            enum:
              - idVerification
              - livenessDetection
              - selfieWithId
          description: List of KYC factors to check when using the KYC protection (only
            for external recipients; protection method).
          nullable: true
        kycProviders:
          type: array
          items:
            type: string
          description: Allowed KYC providers to verify the user (only for external
            recipients; protection method).
          nullable: true
        language:
          type: string
          pattern: ^[a-z][a-z-]+$
          minLength: 1
          description: Language code for notifications and the user interface when the
            recipient accesses the document. If not specified, the system will
            use the recipient's preferred language or the organization's default
            language.
          example: en
          nullable: true
        mail:
          type: string
          pattern: ^[A-Za-z0-9.@_-]+$
          maxLength: 128
          format: email
          description: Email address for OTP protection (only for external recipients;
            protection method).
          example: john.doe@example.com
          nullable: true
        message:
          type: string
          maxLength: 2000
          description: Private message for this share recipient only.
          example: Please review this document by Friday.
          nullable: true
        nafathId:
          type: string
          description: Nafath person ID for share verification (only for external
            recipients; protection method).
          nullable: true
        oauthFactors:
          type: array
          items:
            $ref: "#/components/schemas/entitySharesOauthFactor"
          minItems: 0
          description: Optional array with factor types and values to check when using the
            OAuth protection. Defaults to the email  (only for external
            recipients; protection method).
          nullable: true
        order:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          description: Order in which this recipient should act when sequential is true.
            Recipients with the same order number can act in parallel within
            their group.
          example: 1
        password:
          type: string
          description: User specified password for document protection (only for external
            recipients; protection method).
          example: "553827"
          nullable: true
        phone:
          type: string
          pattern: ^\+?[1-9]\d{1,14}$
          description: Phone number for OTP (only for external recipients; protection
            method).
          example: "+493012345678"
          nullable: true
        quorum:
          type: integer
          minimum: 1
          exclusiveMinimum: false
          description: Number of recipients required to complete the action when multiple
            recipients have the same order number. For example, if 3 recipients
            have the same order and quorum is 2, only 2 need to complete the
            action to proceed.
          example: 2
        sharePurpose:
          type: string
          description: Purpose of the share, which determines what action the recipient
            can perform.
          enum:
            - view
            - edit
            - sign
            - execute
            - approve
            - review
            - accept
        shareTo:
          oneOf:
            - type: string
              pattern: ^[A-Za-z0-9.@_-]+$
              description: Username that identifies a user in the system (optional). Usually
                an email address.
              example: john.doe@example.com
              nullable: true
            - type: string
              pattern: ^[A-Za-z0-9.@_-]+$
              maxLength: 128
              format: email
              description: Email address (optional).
              example: john.doe@example.com
              nullable: true
          description: Email address or username of the recipient. For internal users,
            this can be their username. For external recipients, this must be a
            valid email address.
        validUntil:
          type: string
          format: date-time
          description: Date and time when the share expires. After this time, the
            recipient can no longer access the document (ISO 8601).
          nullable: true
      required:
        - sharePurpose
        - shareTo
