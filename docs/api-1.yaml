openapi: 3.0.3
info:
  title: Circularo API for Integrators
  description: >-
    Welcome to the Circularo Integrator's API. This schema provides a focused
    subset of our most essential REST API endpoints, designed to help you
    quickly build powerful integrations for document management and e-signing.


    With these selected resources, you can automate the core document lifecycle,
    embed signing workflows into your own applications, and manage users
    programmatically.


    ### Key Integration Scenarios:


    * **Core Document Workflow:** Efficiently handle the entire document
    lifecycle, including uploading files, creating documents from templates, and
    managing their status.

    * **Signing and Sharing:** Programmatically share documents for electronic
    and digital signatures, seal them for integrity, and automate complex
    approval processes.

    * **User and Group Management:** Create, retrieve, and manage users and
    groups to synchronize with your own systems.

    * **Real-Time Notifications:** Use webhooks to receive instant notifications
    about document events, such as when a document is signed or completed.

    * **Authentication:** Securely authenticate your integration using either
    short-lived session tokens or long-lived API keys.


    This reference covers the most frequent integration scenarios. For a
    comprehensive list of all available endpoints, including advanced
    configurations and administrative functions, please consult the full API
    documentation on the Circularo Developer Portal.
  contact:
    name: Circularo
    url: https://developers.circularo.com/
    email: support@circularo.com
  version: 26.0.0
tags:
  - name: API
    description: Endpoints for CRUD operations with API tokens used for system
      integration. API tokens provide long-lived authentication for external
      systems connecting to Circularo.
  - name: Attachments
    description: Endpoints for CRUD operations with document attachments. These
      endpoints enable adding, retrieving, updating, and deleting files attached
      to documents. The API supports attaching multiple files to documents,
      retrieving individual attachments or downloading all attachments as a ZIP
      archive, and managing attachments for document drafts.
  - name: Definitions
    description: Endpoints for CRUD operations with document definitions and
      workflow configurations. These endpoints enable management of workflow
      states, transition rules, and document types that serve as the foundation
      for document creation and processing.
  - name: Documents
    description: Endpoints for CRUD operations with documents. These endpoints
      enable comprehensive document lifecycle management, including creation,
      workflow processing, digital signing, sealing, and access control. The API
      supports batch operations, and detailed audit trails.
  - name: Export
    description: Endpoints for retrieving available exporters and exporting
      documents in various formats. These endpoints enable filtering documents
      using search criteria, exporting in multiple formats (PDF, ZIP, JSON,
      etc.), and customizing export behavior through exporter-specific options.
  - name: Files
    description: Endpoints for CRUD operations with files and file metadata. These
      endpoints enable uploading, downloading, converting, and organizing files
      within the Circularo platform. Files can be categorized, converted to PDF
      format, made public or private, and analyzed for form fields and signature
      anchors. The API supports efficient file streaming, partial content
      retrieval, and storage capacity management.
  - name: Folders
    description: Endpoints for CRUD operations with document folders. These
      endpoints enable hierarchical organization of documents, movement between
      personal and shared folder structures, and management of document
      collections. Folders provide a structured way to categorize and access
      documents throughout the Circularo platform.
  - name: Groups
    description: Endpoints for CRUD operations with user groups. These endpoints
      enable comprehensive group management, including creation, membership
      control, and permission assignment. Groups provide a mechanism for
      organizing users, defining organizational structures, and assigning access
      rights through ACLs.
  - name: Login
    description: Endpoints for user authentication, session management, and access
      control. These endpoints enable secure login with multi-factor
      authentication, token validation, session monitoring, and password
      recovery. The authentication system supports various authentication
      methods, including username/password, with additional security through MFA
      verification.
  - name: Logout
    description: Endpoints for managing user logout operations. These endpoints
      enable terminating the current user session, invalidating authentication
      tokens, and administrative capabilities for terminating all sessions for a
      specific user. The logout functionality supports both standard
      authentication and identity provider (OAuth/SAML) integration.
  - name: Logs
    description: Endpoints for searching, retrieving, and managing system audit
      logs. These endpoints enable access to detailed chronological records of
      user activities and system events, supporting compliance requirements,
      security monitoring, and operational auditing. The API supports powerful
      Elasticsearch-based queries with pagination for handling large volumes of
      log data.
  - name: Ping
    description: Endpoints for checking system availability and health status. The
      ping endpoint provides a simple mechanism to verify that the API server is
      running and responsive, useful for monitoring systems and validating
      connectivity to the Circularo service.
  - name: Search
    description: Endpoints for advanced document searching, analytics, and
      reporting. These endpoints enable powerful Elasticsearch-based queries
      across document content and metadata and dashboard analytics for business
      intelligence. Search functionality supports complex filtering,
      aggregation, and pagination.
  - name: Share
    description: Endpoints for CRUD operations with document shares. These endpoints
      enable secure document distribution to internal and external recipients,
      workflow management for approvals and signatures, access control through
      various authentication methods, and tracking of recipient activities. The
      sharing system supports sequential processing, automatic reminders,
      permanent access links, and comprehensive security options for sensitive
      documents.
  - name: Templates
    description: Endpoints for CRUD operations with document templates. Templates
      provide reusable configurations for document workflows, including
      signature field placement and sharing rules. These endpoints enable
      standardized document processing and consistent signature workflows across
      the Circularo platform.
  - name: Users
    description: Endpoints for CRUD operations with user accounts. These endpoints
      enable comprehensive user lifecycle management, including registration,
      activation, profile configuration, group membership, and authentication
      settings. Administrators can manage user permissions, search for users
      with specific criteria, and configure user-specific preferences.
  - name: Webhooks
    description: Endpoints for CRUD operations with webhooks. These endpoints enable
      integration with external systems through real-time event notifications
      about document status changes and workflow progress. Webhooks provide a
      mechanism for automating processes and synchronizing third-party
      applications with activities in the Circularo platform.
paths:
  /api/key/{key}:
    delete:
      summary: Delete an API token
      description: >-
        This endpoint permanently invalidates and deletes an API token.


        When an API token is no longer needed, you should delete it using this
        endpoint. Deleting an API token:

        1. Immediately invalidates the token, preventing any further API calls
        using that token

        2. Maintains a record of the token in the system for audit purposes, but
        marks it as invalid

        3. Removes it from the list of active tokens


        Note: This action cannot be undone. Once an API token is deleted, you
        cannot restore it and will need to create a new token if needed.


        ---




        **No authorization:** No authorization is required to call this
        endpoint.
      operationId: requestApiDeleteKey
      tags:
        - API
      security: []
      parameters:
        - in: path
          name: key
          description: API token to be deleted.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a11b868cbba3cd8056ce6adb44d46a11a113170e884509c179701270b97cf16f
      responses:
        "200":
          description: The API token was successfully deleted and invalidated. Any future
            attempts to use this token will fail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
          description: Invalid token format.
        "401":
          description: Authentication failed. A valid token is required to delete API
            tokens.
        "404":
          description: The specified API token was not found or is not an API token. This
            may occur if the token was already deleted or never existed.
  /api/key:
    get:
      summary: List your API tokens
      description: >-
        This endpoint retrieves all API tokens associated with your user
        account.


        API tokens are long-lived authentication tokens that provide a more
        efficient method for integrating external systems with Circularo. This
        endpoint allows you to:

        1. View all your API tokens

        2. Check when each token was created and last used

        3. See the description and type of each token


        This information is useful for managing your API tokens, including
        identifying unused tokens that may need to be deleted for security
        purposes.


        Note: Only API tokens created by your user account will be returned.


        ---




        **Token authorization:** Authorize using token to call this endpoint.
      operationId: requestApiGetKey
      tags:
        - API
      security:
        - Token: []
      responses:
        "200":
          description: Returns a list of your API tokens with their details. If you don't
            have any API tokens, an empty array will be returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseApiTokenMultiple"
        "401":
          description: Authentication failed.
    post:
      summary: Create a new API token for integration
      description: >-
        This endpoint creates a new API token that can be used for integrating
        external systems with Circularo.


        API keys provide a more efficient method for system integration compared
        to regular authentication tokens. They:

        1. Have a longer validity period (10 years by default)

        2. Can be managed separately from user login sessions


        After creating an API token, you can use it for subsequent API calls by
        including it in the query parameters of the request instead of the
        regular user token.


        Note: You must be authenticated with a regular user token to create an
        API key. The created API key will be associated with your user account.


        ---




        **Token authorization:** Authorize using token to call this endpoint.
      operationId: requestApiPostKey
      tags:
        - API
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestApiPostKey"
      responses:
        "200":
          description: Returns the ID of the newly created API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericId"
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed. A valid user token is required to create an
            API token.
  /attachments/{id}/{hash}/{version}:
    delete:
      summary: Delete an attachment from a document
      description: >-
        This endpoint removes a specific file attachment from a document in the
        Circularo system.


        Attachments in Circularo are used to provide supporting or reference
        materials with a document.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[add_file_attachments]`
      operationId: requestAttachmentsDeleteAttachment
      tags:
        - Attachments
      security:
        - Token: []
      parameters:
        - in: path
          name: hash
          description: Unique hash (identifier) of the attachment file to delete. This
            hash is returned when listing document attachments or when uploading
            the attachment file.
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9]+$
            minLength: 1
            example: s1pss1atbzli272pinbt48n2ssy96ax2pwgqrz5qyzklwxg1kl0tq6anvz1p97xj
        - in: path
          name: id
          description: Unique identifier of the document from which the attachment will be
            deleted. This ID is returned when creating documents or listing
            documents.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        - in: path
          name: version
          description: Document version number. This must match the current version of the
            document to prevent conflicts when multiple users are editing
            simultaneously. The version number is returned when retrieving
            document details.
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            example: 6
      responses:
        "200":
          description: The attachment was successfully deleted from the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to delete attachments.
        "404":
          description: Document not found. The specified ID does not correspond to any
            document accessible by the user.
        "409":
          description: Document version conflict. The document has been modified by
            another user since you retrieved it.
  /attachments/{id}/{hash}:
    get:
      summary: Retrieve a document attachment
      description: >-
        This endpoint retrieves a specific file attachment from a document in
        the Circularo system.


        Attachments in Circularo are used to provide supporting or reference
        materials with a document.


        The endpoint returns the file as a binary stream with appropriate
        headers for downloading, including the correct content type and
        filename.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[view_attachments]`
      operationId: requestAttachmentsGetAttachment
      tags:
        - Attachments
      security:
        - Token: []
      parameters:
        - in: path
          name: hash
          description: Unique hash (identifier) of the attachment file to retrieve. This
            hash is returned when listing document attachments or when uploading
            the attachment file.
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9]+$
            minLength: 1
            example: s1pss1atbzli272pinbt48n2ssy96ax2pwgqrz5qyzklwxg1kl0tq6anvz1p97xj
        - in: path
          name: id
          description: Unique identifier of the document containing the attachment. This
            ID is returned when creating documents or listing documents.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
      responses:
        "200":
          description: Returns the attachment file as a binary stream with appropriate
            headers for downloading.
          content:
            "*": {}
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to view attachments.
        "404":
          description: Document or attachment not found. The specified document ID or file
            hash does not correspond to any accessible resource.
  /attachments/{id}:
    post:
      summary: Add an attachment to a document
      description: >-
        This endpoint allows you to add a file attachment to an existing
        document in the Circularo system.


        Attachments in Circularo are used to provide supporting or reference
        materials with a document.


        Note: Files must be uploaded separately before they can be referenced as
        attachments.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[add_file_attachments]`
      operationId: requestAttachmentsPostAttachment
      tags:
        - Attachments
      security:
        - Token: []
      parameters:
        - in: path
          name: id
          description: Unique identifier of the document to which the attachment will be
            added. This ID is returned when creating documents or listing
            documents.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestAttachmentsPostAttachment"
      responses:
        "200":
          description: The attachment was successfully added to the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to add attachments.
        "404":
          description: Document not found. The specified ID does not correspond to any
            document accessible by the user.
  /definitions:
    get:
      summary: Retrieve document and workflow definitions
      description: >-
        This endpoint retrieves all available document metadata definitions and
        workflow definitions in the Circularo system.


        The endpoint provides several capabilities:

        1. Retrieve document metadata definitions that define document structure

        2. Get workflow definitions that control document processing flows


        Definitions in Circularo are fundamental configuration elements that:

        - Define the structure and behavior of different document types

        - Control how documents move through approval and processing workflows

        - Specify available fields for document creation

        - Determine what actions users can take on documents in different states


        This information is particularly useful for:

        - Building custom document creation interfaces

        - Understanding available document types and their capabilities

        - Implementing workflow automation and integration

        - Determining what actions are available for documents in specific
        states


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDefinitionsGetDefinitions
      tags:
        - Definitions
      security:
        - Token: []
      responses:
        "200":
          description: Returns an array of document and workflow definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseDefinitionsMultiple"
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to access definitions.
  /definitions/documents:
    get:
      summary: Retrieve document metadata definitions
      description: >-
        This endpoint retrieves document metadata definitions available in the
        Circularo system.


        Document metadata definitions in Circularo are used to:

        - Define the structure and fields for different document types

        - Configure form layouts for document creation and editing

        - Specify formulas for automatic field populating

        - Control document processing options


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDefinitionsGetMetadatas
      tags:
        - Definitions
      security:
        - Token: []
      responses:
        "200":
          description: Returns the requested document metadata definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseDefinitionsMultiple"
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions.
  /definitions/workflows:
    get:
      summary: Retrieve workflow definitions
      description: >-
        This endpoint retrieves accessible workflow definitions from the
        Circularo system.


        Workflow definitions in Circularo are used to:

        - Define the lifecycle of documents in the system

        - Configure approval and review processes

        - Specify state transitions and required permissions

        - Control document processing and routing options


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_workflow]`
      operationId: requestDefinitionsGetWorkflows
      tags:
        - Definitions
      security:
        - Token: []
      responses:
        "200":
          description: Returns accessible workflow definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseDefinitionsMultiple"
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions.
  /documents:
    delete:
      summary: Delete documents
      description: >-
        This endpoint allows you to delete one or more documents from the
        Circularo system.


        The endpoint provides several capabilities:

        1. Delete one or multiple documents in a single operation

        2. Choose between moving documents to trash (soft delete) or permanent
        deletion

        3. Process documents in bulk for efficient management of large document
        sets


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsDeleteBulk
      tags:
        - Documents
      security:
        - Token: []
      parameters:
        - in: query
          name: hardDelete
          description: When set to true, documents will be permanently deleted from the
            system. When false, documents are moved to the trash and can be
            restored later. Use permanent deletion with caution as it cannot be
            undone.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestDocumentsDeleteBulk"
      responses:
        "200":
          description: Returns details about unsuccessful document delete operations,
            other documents were deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericBulk"
        "400":
          description: Invalid request format, missing required fields, or invalid
            document IDs.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to delete documents.
    post:
      summary: Create a new document
      description: >-
        This endpoint creates a new document in the Circularo system.


        Using this endpoint, you can do the following with the new document:

        1. Attach files

        2. Assign workflows and recipients

        3. Set metadata and properties

        4. Apply optional features like PDF conversion, signatures, and
        annotations


        After successful creation, the system returns detailed information about
        the new document, including its unique identifier.


        Notes:

        1. Files must be uploaded separately before they can be referenced in
        this request

        2. The document type must be a valid type

        3. The workflow type must be a valid workflow

        4. For electronic documents (definitionType: "edoc"), include HTML
        content in the "html" field

        5. For external documents (definitionType: "ext"), include the main file
        in the "pdfFile" field (it doesn't have to be a PDF file)

        6. To add signature fields for signing, include them in the
        optionalData.signFields array

        7. To place the document in a folder, specify the folder ID in
        optionalData.folder


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsPostDocument
      tags:
        - Documents
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestDocumentsPostDocument"
      responses:
        "200":
          description: Returns the newly created document details and associated user
            information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseDocumentsMultiple"
        "400":
          description: Invalid request format or missing required fields.
        "401":
          description: Authentication failed.
        "402":
          description: Insufficient subscription capacity.
        "403":
          description: Insufficient permissions to create document.
        "404":
          description: Referenced resources (files, templates, etc.) were not found.
  /documents/{id}/audit:
    get:
      summary: Generate an audit trail for a document
      description: >-
        This endpoint generates a comprehensive audit trail PDF for a specific
        document in the Circularo system.


        The endpoint provides several capabilities:

        1. Create a tamper-proof record of all actions performed on a document

        2. Include detailed information about each event in the document's
        lifecycle

        3. Show who performed each action and when it occurred

        4. Generate a downloadable PDF that can be saved or printed


        An audit trail serves as an official record of a document's history and
        is particularly useful for:

        - Compliance and regulatory requirements

        - Legal verification of document authenticity

        - Dispute resolution regarding document handling

        - Internal auditing and process verification


        The audit trail includes information such as:

        - Document creation details

        - Workflow transitions and approvals

        - Signature events with timestamps


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsGetAuditTrail
      tags:
        - Documents
      security:
        - Token: []
      parameters:
        - in: path
          name: id
          description: Unique identifier of the document for which to generate an audit
            trail. This ID is returned when creating documents or listing
            documents.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
      responses:
        "200":
          description: Returns a PDF file containing the complete audit trail for the
            specified document.
          content:
            application/pdf: {}
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to access this document's audit trail.
        "404":
          description: Document not found. The specified ID does not correspond to any
            document accessible by the user.
  /documents/{id}:
    get:
      summary: Retrieve a single document
      description: >-
        This endpoint retrieves detailed information about a specific document
        in the Circularo system.


        The endpoint provides:

        1. Complete document metadata (title, creation date, owner, etc.)

        2. Document content and structure

        3. Workflow information and current status

        4. File attachments and their details

        5. User information for all users associated with the document


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsGetDocument
      tags:
        - Documents
      security:
        - Token: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of the document to retrieve. This ID is
            returned when creating documents or listing documents.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        - in: query
          name: inTrash
          description: When set to true, the system will search for the document in the
            trash instead of active documents.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Returns the requested document with all its details and associated
            user information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseDocumentsMultiple"
        "401":
          description: Authentication failed. A valid user token with appropriate
            permissions is required.
        "403":
          description: Insufficient permissions.
        "404":
          description: Document not found. The specified ID does not correspond to any
            document accessible by the user.
  /documents/sign/{version}/start/digest:
    post:
      summary: Sign a document with digital signatures
      description: >-
        This endpoint applies digital signatures to a document and marks it as
        officially signed.


        The endpoint provides several capabilities:

        1. Add digital signatures to specific positions in the document

        2. Support multiple signature types

        3. Include additional annotations and images alongside signatures

        4. Support various signature providers


        When a document is signed:

        - The signatures are embedded in the PDF

        - The document is marked as signed in the system

        - The document's workflow may advance to the next step

        - The document's audit trail is updated


        Note:

        1. This endpoint requires the document version to prevent conflicts when
        multiple users are editing the same document simultaneously

        2. For handwritten signatures, the signature image must be uploaded
        first

        3. The signatureType determines whether the signature is a cryptographic
        signature or just a visual representation

        4. The document must be in a workflow state that allows signing


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsPostSignStartDigest
      tags:
        - Documents
      security:
        - Token: []
      parameters:
        - in: path
          name: version
          description: Document version number. This must match the current version of the
            document to prevent conflicts when multiple users are editing
            simultaneously. The version number is returned when retrieving
            document details.
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            example: 6
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestDocumentsPostSignStartDigest"
      responses:
