          example: https://example.com/webhook/circularo
        createDate:
          type: string
          format: date-time
          description: Date and time when the webhook was created.
        creator:
          type: string
          description: Username of the user who created the webhook.
          example: admin@example.com
        hmacSecret:
          type: string
