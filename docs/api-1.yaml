  /documents/seal/{version}:
    put:
      summary: Seal a document with digital certificate and/or timestamp
      description: >-
        This endpoint applies cryptographic sealing to a document, providing
        proof of authenticity and integrity.


        The endpoint offers two types of sealing mechanisms that can be used
        individually or together:

        1. Digital Certificate: Adds a cryptographic seal that verifies the
        document's authenticity and integrity

        2. Timestamp: Adds a trusted timestamp from a Time Stamping Authority
        (TSA) that proves when the document was sealed


        Sealing a document:

        - Marks the document as officially signed

        - Prevents further modifications to the document content

        - Creates a cryptographically verifiable proof of the document's
        authenticity

        - Establishes a verifiable timestamp of when the document was sealed (if
        timestamp option is enabled)


        Note:

        1. This endpoint requires the document version to prevent conflicts when
        multiple users are editing the same document simultaneously

        2. At least one of 'certificate' or 'timestamp' must be set to true

        3. The document must be in a state that allows sealing


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestDocumentsPutSeal
      tags:
        - Documents
      security:
        - Token: []
      parameters:
        - in: path
          name: version
          description: Document version number. This must match the current version of the
            document to prevent conflicts when multiple users are editing
            simultaneously. The version number is returned when retrieving
            document details.
          required: true
          schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            example: 6
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestDocumentsPutSeal"
      responses:
        "200":
          description: The document was successfully sealed with the requested certificate
            and/or timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericStatus"
        "400":
          description: Invalid request format or neither certificate nor timestamp was set
            to true.
        "401":
          description: Authentication failed.
        "402":
          description: Insufficient subscription capacity. Your organization's
            subscription does not have enough transactions available.
        "403":
          description: Insufficient permissions to seal this document.
        "404":
          description: Document not found. The specified ID does not correspond to any
            document accessible by the user.
        "409":
          description: Document version conflict. The document has been modified by
            another user since you retrieved it.
        "428":
          description: Document is in a state that cannot be sealed.
