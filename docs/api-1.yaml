          example: john.doe@example.com
        name:
          type: string
          pattern: ^[A-Za-z0-9.@_-]+$
          description: Username and unique identifier of the user. This value may be
            internally altered in case of collision with deleted user to ensure
            uniqueness.
          example: john.doe@example.com
          nullable: true
        organization:
          type: string
          description: ID of the organization this user should belong to. Changing a
            user's organization will remove all existing group memberships if
            they are in a different organization.
          nullable: true
        password:
          type: string
          maxLength: 128
          description: User password (optional).
          example: SecurePassword123
          nullable: true
        phone:
          type: string
          pattern: ^\+?[1-9]\d{1,14}$
          description: User's phone number.
          example: "+493012345678"
          nullable: true
        role:
          type: string
          description: User's role or job title in the organization. This is for
            informational purposes only and does not affect permissions.
          example: Account Manager
          nullable: true
        status:
          type: string
          description: Account status.
          enum:
            - active
            - password_change_requested
            - newly_created
        termsAccepted:
          type: boolean
          description: Indicates whether the user has accepted the Terms and Conditions.
        timeformat:
          type: string
          description: User's preferred time format using Luxon tokens. This affects how
            times are displayed throughout the application.
          example: h:mm a
          nullable: true
        timezone:
          type: string
          description: User's timezone in IANA format (e.g., 'America/New_York',
            'Europe/London'). Affects how dates and times are displayed and
            interpreted.
          example: UTC
          nullable: true
      required:
        - fullname
        - mail
        - status
    requestUsersPostSearch:
      type: object
      properties:
        activeSessions:
          type: boolean
          description: When set to true, the response will include information about each
            user's active sessions.
        aggregations:
          type: object
          additionalProperties: false
          description: Elasticsearch aggregations query to perform analytics on the user
            data.
        format:
          type: string
          description: Response format determining how much user information is returned.
          enum:
            - minimal
            - full
          example: minimal
          default: minimal
        includeContacts:
          type: boolean
          description: "When set to true, the search will include results from the user's
            contact list. Note: This should not be used together with rights and
            workflow filters, as contacts will not be returned if these filters
            are applied."
        includeGroups:
          type: boolean
          description: When set to true, the search will include groups in the results.
            This allows searching for both users and groups in a single request.
        lastActivity:
          type: boolean
          description: When set to true, the response will include the last activity
            timestamp for each internal user.
        rights:
          type: array
          items:
            type: string
          description: Array of permission rights. When provided, the search will only
            return users who have at least one of these rights.
          example:
            - view_users
            - update_users
        userQuery:
          allOf:
            - $ref: "#/components/schemas/internalSearchQuery"
          description: Wrapper for Elasticsearch query that defines which users to retrieve.
    requestUsersPostUser:
      type: object
