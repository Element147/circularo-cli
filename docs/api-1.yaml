        1. Update one or multiple templates in a single operation

        2. Modify template configuration

        3. Update signature fields and their positions

        4. Change file reference with options to clone files


        When updating templates:

        - You can only update templates that you have permission to edit

        - When updating multiple templates at once, the same changes are applied
        to all templates

        - When updating file reference, you can choose to clone the file to
        prevent conflicts (each template has to use dedicated, unused file)


        ---




        **Token authorization:** Authorize using token to call this endpoint.
      operationId: requestTemplatesPutTemplate
