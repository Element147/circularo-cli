    requestUsersPutUser:
      type: object
      properties:
        dateformat:
          type: string
          description: User's preferred date format using Luxon tokens. This affects how
            dates are displayed throughout the application.
          example: dd/MM/yyyy
          nullable: true
        firstDayOfWeek:
          type: integer
          description: First day of week to use in calendars. 1 is Monday and 7 is Sunday.
          example: 1
        fullname:
          type: string
          description: User's full name as displayed in the UI.
          example: John Doe
        group:
          type: array
          items:
            type: string
          description: Array of group IDs that this user should belong to. When specified,
            this will replace the user's existing group memberships.
          example:
            - 12e2b52d-01a1-4048-abc5-4bb54c859d52
            - b0df3f1d-94ca-49b2-07c9-76f5acd0421a
        mail:
          type: string
          pattern: ^[A-Za-z0-9.@_-]+$
          maxLength: 128
          format: email
          description: User's email address. This is typically also used as their username.
          example: john.doe@example.com
          nullable: true
        organization:
          type: string
          description: ID of the organization this user should belong to. Changing a
            user's organization will remove all existing group memberships if
            they are in a different organization.
          nullable: true
        password:
          type: string
          maxLength: 128
          description: New password for the user. If provided, the user's password will be
            updated.
          example: SecurePassword123
          nullable: true
        phone:
          type: string
          pattern: ^\+?[1-9]\d{1,14}$
          description: User's phone number.
          example: "+493012345678"
          nullable: true
        role:
          type: string
          description: User's role or job title in the organization. This is for
            informational purposes only and does not affect permissions.
          example: Account Manager
          nullable: true
        status:
          type: string
          description: User's account status. Controls whether the user can log in and
            access the system.
          enum:
            - null
            - active
            - password_change_requested
            - suspended
            - newly_created
          nullable: true
        termsAccepted:
          type: boolean
          description: Indicates whether the user has accepted the Terms and Conditions.
        timeformat:
          type: string
          description: User's preferred time format using Luxon tokens. This affects how
            times are displayed throughout the application.
          example: h:mm a
          nullable: true
        timezone:
          type: string
          description: User's timezone in IANA format (e.g., 'America/New_York',
            'Europe/London'). Affects how dates and times are displayed and
