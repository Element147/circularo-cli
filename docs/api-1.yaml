  /export:
    get:
      summary: List all available exporters
      description: >-
        This endpoint retrieves a list of all available exporters in the
        Circularo system.


        Exporters are components that can extract and format data from the
        system for various purposes:

        1. Generating reports in different formats (JSON, CSV, etc.)

        2. Exporting documents and their metadata

        3. Creating data extracts for integration with other systems


        The endpoint allows filtering exporters by type, making it easier to
        find specific exporters for your needs.


        Note: To use the exporters listed by this endpoint, you'll need to call
        the POST /export endpoint with the exporter name and any required
        parameters.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestExportGetAll
      tags:
        - Export
      security:
        - Token: []
      responses:
        "200":
          description: Returns a list of available exporters with their configuration
            details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseExportMultiple"
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to access exporters.
    post:
      summary: Export documents
      description: >-
        This endpoint exports documents that match specified search criteria
        using a selected exporter.


        The endpoint provides several capabilities:

        1. Export documents in various formats (PDF, ZIP, CSV, JSON, etc.)

        2. Filter documents using Elasticsearch query syntax

        3. Customize export behavior with exporter-specific options


        The export process works as follows:

        1. Select an exporter from those available via the GET /export endpoint

        2. Define search criteria to select which documents to export

        3. Provide any exporter-specific options to customize the output

        4. Receive the exported data directly or a job ID for background exports


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestExportPostExport
      tags:
        - Export
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestExportPostExport"
      responses:
        "200":
          description: Returns the exported data in the format determined by the selected
            exporter.
          content:
            "*": {}
        "400":
          description: Invalid request data.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to export documents.
        "404":
          description: No documents found matching the search criteria.
  /files/loadFile/hash/{hash}:
    get:
      summary: Download a file from Circularo storage
      description: >-
        This endpoint retrieves and downloads a file from Circularo storage
        using its unique hash identifier.


        The endpoint provides several capabilities:

        1. Download any file type stored in the system

        2. Stream large files efficiently

        3. Support partial content retrieval for resumable downloads

        4. Verify user permissions before allowing access


        When called, the endpoint:

        1. Validates that the user has permission to access the requested file

        2. Retrieves the file from storage

        3. Sets appropriate headers for file download

        4. Streams the file content to the client


        The file is returned with Content-disposition: attachment, prompting the
        browser to download rather than display the file.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_file_management]`
      operationId: requestFilesGetFile
      tags:
        - Files
      security:
        - Token: []
      parameters:
        - in: path
          name: hash
          description: The unique file identifier (hash) of the file to download. This is
            the same hash returned when uploading a file or listing files.
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: File is streamed to the client with appropriate headers for
            download. The response includes the file content with Content-Type
            matching the file's MIME type.
          content:
            "*": {}
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to access this file. The user does not
            have rights to download this file.
        "404":
          description: File not found. The specified hash does not correspond to any file
            in storage.
  /files/saveFile:
    post:
      summary: Upload and save a file to Circularo storage
      description: >-
        This endpoint allows you to upload a file to the Circularo system and
        save it to storage.


        The endpoint provides several capabilities:

        1. Upload any file type to the system

        2. Optionally mark files as public (accessible without authentication)

        3. Check for fillable form fields in PDF documents

        4. Check for signature fields in PDF documents

        5. Check for text anchors for signature positioning in PDF documents

        6. Convert PDF files to PDF/A format


        After successful upload, the system returns detailed information about
        the file, including its unique identifier, metadata, and storage usage
        statistics. For PDF files, it can also return information about detected
        form fields and signature fields.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_file_management]`
      operationId: requestFilesPostFile
      tags:
        - Files
      security:
        - Token: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/requestFilesPostFile"
      responses:
        "200":
          description: File was successfully uploaded and saved. Returns file information,
            storage capacity details, and any detected form or signature fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseFilesUpload"
        "401":
          description: Authentication failed. A valid user token with appropriate
            permissions is required.
        "403":
          description: Insufficient permissions to upload file.
        "412":
          description: Storage quota exceeded.
  /folders:
    delete:
      summary: Delete folders
      description: >-
        This endpoint allows you to delete one or more folders from the
        Circularo system.


        The endpoint provides several capabilities:

        1. Delete multiple folders in a single operation

        2. Choose between moving folders to trash (soft delete) or permanent
        deletion

        3. Handle documents within deleted folders appropriately


        When folders are deleted:

        - By default, they are moved to the trash and can be restored later

        - With hardDelete=true, they are permanently removed from the system

        - Documents within the folders are handled based on user permissions:
          - Documents you can edit will follow the folder's deletion mode
          - Documents you can only read will be removed from the folder rather than deleted

        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestFoldersDeleteFolder
      tags:
        - Folders
      security:
        - Token: []
      parameters:
        - in: query
          name: hardDelete
          description: When set to true, folders will be permanently deleted from the
            system. When false, folders are moved to the trash and can be
            restored later. Use permanent deletion with caution as it cannot be
            undone.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestFoldersDeleteFolder"
      responses:
        "200":
          description: Returns details about unsuccessful folder delete operations, other
            folders were deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericBulk"
        "400":
          description: Invalid request format, missing required fields, or invalid folder
            IDs.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to delete folders.
        "404":
          description: One or more folders were not found. The specified folder IDs do not
            correspond to any folders accessible by the user.
    post:
      summary: Create a new folder for documents
      description: >-
        This endpoint creates a new folder in the Circularo system for
        organizing documents.


        The endpoint provides several capabilities:

        1. Create folders in either your personal folder structure or in the
        shared folder structure

        2. Create folders at the root level or as subfolders within existing
        folders

        3. Organize documents by creating a hierarchical folder structure


        Folders help organize documents in the system, making them easier to
        find and manage. You can:

        - Group related documents together

        - Create a hierarchical structure that mirrors your organization's
        document classification

        - Separate personal documents from shared documents


        After successful creation, the system returns the unique identifier of
        the newly created folder, which can be used in subsequent API calls to
        place documents in this folder.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestFoldersPostFolder
      tags:
        - Folders
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestFoldersPostFolder"
      responses:
        "200":
          description: Returns the ID of the newly created folder. This ID can be used
            when creating or moving documents to place them in this folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericId"
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to create folders.
        "404":
          description: Parent folder doesn't exist or you don't have permission to access
            it.
  /folders/{folderId}:
    get:
      summary: Retrieve a folder information
      description: >-
        This endpoint retrieves detailed information about a specific folder in
        the Circularo system.


        The endpoint provides several capabilities:

        1. Retrieve complete folder metadata (name, creation date, creator,
        etc.)

        2. Get folder structure information (parent folder, path, level)

        3. Check access rights and permissions for the folder


        Folders in Circularo are used to:

        - Organize documents in a hierarchical structure

        - Group related documents together

        - Control access to collections of documents


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestFoldersGetFolder
      tags:
        - Folders
      security:
        - Token: []
      parameters:
        - in: path
          name: folderId
          description: Unique identifier of the folder to retrieve. This ID is returned
            when creating folders or listing folders.
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            example: 97cfb9de-92dd-413a-b5e7-175eff7506d6
            nullable: true
        - in: query
          name: inTrash
          description: When set to true, the system will search for the folder in the
            trash instead of active folders.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Returns the requested folder with all its details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseFoldersSingle"
        "400":
          description: Invalid request format or parameters.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to view this folder.
        "404":
          description: Folder not found. The specified ID does not correspond to any
            folder accessible by the user.
  /folders/move:
    put:
      summary: Move documents and folders to a selected folder
      description: >-
        This endpoint moves specified documents and folders to a target folder
        location.


        The endpoint provides several capabilities:

        1. Move multiple documents and folders in a single operation

        2. Move items to a specific folder or to the root level

        3. Control how access rights are inherited from the destination folder

        4. Move between personal and shared folder structures


        Moving items helps with document organization by allowing you to:

        - Reorganize your folder structure as your needs change

        - Group related documents together

        - Clean up your workspace by moving completed documents to archive
        folders


        Note: You must have edit permissions for both the items being moved and
        the destination folder.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
      operationId: requestFoldersPutToFolder
      tags:
        - Folders
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestFoldersPutToFolder"
      responses:
        "200":
          description: The items were successfully moved to the target folder. The
            response includes details about each processed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericBulk"
        "400":
          description: Invalid request format.
        "401":
          description: Authentication failed.
        "403":
          description: Insufficient permissions to move the specified items or to access
            the destination folder.
        "404":
          description: One or more of the specified items or the destination folder was
            not found.
        "409":
          description: Cannot move a folder into itself or one of its subfolders.
  /groups/{id}:
    get:
      summary: Retrieve a single group by ID
      description: >-
