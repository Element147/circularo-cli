            message will be included in notifications sent to recipients.
          example: Document has been revised. A new version will be shared shortly.
        shareIds:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            minLength: 1
            description: Unique identifier of the sharing operation.
            example: sd0oAvfpB4k0yDf787x4
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Array of share IDs to disable. Each ID must correspond to an active
            share that you have permission to disable.
      required:
        - shareIds
    requestSharesPutSignFinishDigest:
      type: object
      properties:
