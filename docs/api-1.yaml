          description: User's full name as displayed in the UI.
          example: John Doe
          nullable: true
        group:
          type: array
          items:
            type: string
          description: Array of group IDs that this user belongs to.
          nullable: true
        id:
          type: string
          description: User's unique ID in the system.
          example: john.doe@example.com
        mail:
          type: string
          description: User's email address. This is typically also used as their username
