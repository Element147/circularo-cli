        2. Organization association details


        Groups in Circularo are used to:

        - Organize users for permission management

        - Assign access rights through ACLs (Access Control Lists)

        - Define organizational structures

        - Manage subscription assignments


        Note: This endpoint requires administrative permissions. Only system
        administrators or organization administrators can access group details.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[view_groups]`


        **Required user role:** `admin or organization_admin`
      operationId: requestGroupsGetGroup
      tags:
        - Groups
