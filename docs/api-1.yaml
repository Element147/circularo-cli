    post:
      summary: Create a new document template
      description: >-
        This endpoint creates a new template in the Circularo system.


        The endpoint provides several capabilities:

        1. Create templates for document sharing and signing workflows

        2. Define signature fields and their positions

        3. Configure security settings for document sharing

        4. Set up automatic reminders and expiration times

        5. Specify workflow settings (sequential/parallel)


        Templates in Circularo are reusable configurations that:

        - Streamline document sharing by saving frequently used settings

        - Ensure consistency in document workflows

        - Standardize signature field placements

        - Define security requirements for different document types


        After successful creation, the system returns the unique identifier of
        the newly created template, which can be used in subsequent API calls to
        reference this template.


        Note: Creating templates consumes template capacity from your
        organization's subscription quota.


        ---




        **Token authorization:** Authorize using token to call this endpoint.
      operationId: requestTemplatesPostTemplate
      tags:
        - Templates
      security:
        - Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestTemplatesPostTemplate"
      responses:
        "200":
          description: Returns the ID of the newly created template. This ID can be used
            when referencing this template in other API calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseGenericId"
        "400":
          description: Invalid request format, missing required fields, or empty template
            data.
