        2. Assign different purposes to each recipient (view, sign, approve,
        review, etc.)

        3. Configure security settings for each external share (password
        protection, email verification, etc.)

        4. Set expiration dates and automatic reminders

        5. Add signature fields, annotations, and images to the document

        6. Configure sequential or parallel workflow for multiple recipients

        7. Include a personalized message for recipients


        When a document is shared:

        - Recipients receive notifications based on their type (internal or
        external)

        - The document's workflow is updated to reflect the sharing action

        - The document becomes accessible to the recipients based on their
        assigned permissions

        - For action-requiring shares (sign, approve, etc.), the document enters
        a workflow state


        Note: External recipients (those without Circularo accounts) will
        receive email invitations to access the shared document.


        ---




        **Token authorization:** Authorize using token to call this endpoint.


        **Required user rights:** `[use_document_management]`
