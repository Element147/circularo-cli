      summary: Delete templates
      description: >-
        This endpoint allows you to delete one or more templates from the
        Circularo system. When templates are deleted, they are permanently
        removed from the system.


        Note: You can only delete templates that you have permission to edit,
        which includes:

        - Templates you own or created

        - Templates shared with you that have edit permissions enabled

