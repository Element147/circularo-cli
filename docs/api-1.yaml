  /login:
    get:
      summary: Check login status and validate authentication token
      description: >-
        This endpoint verifies the current authentication status and returns
        detailed session information.


        The endpoint provides several capabilities:

        1. Validate an existing authentication token

        2. Check if a user is currently logged in

        3. Retrieve user profile and permission information

        4. Determine if additional authentication steps are required

        5. Get system settings and configuration


        This endpoint is particularly useful for:

        - Verifying session status after page refresh or application startup

        - Checking if a token is still valid before making API calls

        - Retrieving user rights and system settings


        The token can be provided as a query parameter or it will be
        automatically read from the browser cookies. If no token is provided or
        the token is invalid, the response will indicate that the user is not
        logged in.


        ---




        **Optional authorization:** Authorize using token or specify the tenant
        to call this endpoint.
      operationId: requestLoginGetLogin
      tags:
        - Login
      security:
        - Token: []
        - Tenant: []
      parameters:
        - in: query
          name: returnToken
          description: When set to true, the authentication token will be included in the
            response body.
          required: false
          schema:
            type: boolean
            example: true
            default: true
        - in: query
          name: token
          description: Optional authentication token to validate. If not provided, the
            endpoint will attempt to use the token from browser cookies.
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            example: a11b868cbba3cd8056ce6adb44d46a11a113170e884509c179701270b97cf16f
            nullable: true
      responses:
        "200":
          description: Returns the current login status and session information. If logged
            in, includes user details, rights, and settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseLogin"
        "401":
          description: No valid authentication token was provided or the token has expired.
    post:
      summary: Authenticate with the Circularo system
      description: >-
        This endpoint provides authentication for the Circularo system:


        1. Authenticate with username (email), password, and tenant name
        (optional)

        2. Use an existing valid token to retrieve user account information


        The token is always set in the cookie. Optionally you can also retrieve
        it in the response body by setting the 'returnToken' parameter to true.


        After successful authentication, the system may require additional
        multi-factor authentication steps depending on your account settings. If
        MFA is required, you'll need to complete the authentication using the
        /login/unlock endpoint.


        For integration purposes: Instead of performing multiple logins/logouts,
        it is recommended to generate an API key after successful authentication
        and use that key for subsequent API calls. API keys can be created using
        the dedicated endpoint and provide a more efficient and secure method
        for integrating with the Circularo API.


        ---




        **No authorization:** No authorization is required to call this
        endpoint.
      operationId: requestLoginPostLogin
      tags:
        - Login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestLoginPostLogin"
      responses:
        "200":
          description: >-
            The response includes:

            1. User information (profile, rights, settings)

            2. Authentication token for subsequent API calls (always in cookie
            and optionally in content body)

            3. Multi-factor authentication requirements (if applicable)


            If multi-factor authentication is required, the 'authentication'
            array will contain the necessary factors to complete. Use the
            /login/unlock endpoint with the provided token to complete the
            authentication process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseLogin"
        "400":
          description: Invalid request format.
        "401":
          description: Invalid credentials.
        "403":
          description: No free subscription.
        "428":
          description: Account is not active.
  /login/recovery:
    post:
      summary: Unlock a token using a recovery code
      description: >-
        This endpoint allows you to unlock a locked authentication token using a
        recovery code in the Circularo system.


        When using a recovery code:

        - The code must have been previously generated for your account

        - Each code can only be used once and is consumed after successful
        authentication

        - All locked authentication factors on the token will be unlocked

        - The system returns the number of remaining recovery codes


        Recovery codes in Circularo are used to:

        - Provide emergency access when standard MFA methods are unavailable

        - Offer an alternative authentication path while maintaining security

        - Ensure account access is not lost if MFA devices are unavailable


        Note: Recovery codes should be stored securely and used only in
        emergency situations when standard MFA methods are unavailable. This
        endpoint requires a valid but locked authentication token.


        ---




        **No authorization:** No authorization is required to call this
        endpoint.
      operationId: requestLoginPostRecovery
      tags:
        - Login
      security: []
      parameters:
        - in: query
          name: token
          description: Authentication token to unlock. This token must be valid but in a
            locked state due to MFA requirements.
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            example: a11b868cbba3cd8056ce6adb44d46a11a113170e884509c179701270b97cf16f
            nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestLoginPostRecovery"
      responses:
        "200":
          description: Token was successfully unlocked using the recovery code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseLoginRecovery"
        "400":
          description: Invalid request.
        "401":
          description: Authentication failed.
        "429":
          description: Too many recovery attempts. Please try again later.
  /login/unlock:
    post:
      summary: Complete multi-factor authentication process
      description: >-
        Completes the multi-factor authentication process after initial login.


        Provide the token received from the login endpoint and the required
        authentication factors with their verification codes.


        ---




        **No authorization:** No authorization is required to call this
        endpoint.
      operationId: requestLoginPostUnlock
      tags:
        - Login
      security: []
      parameters:
        - in: query
          name: token
          description: Authentication token received from the initial login request. This
            token remains locked until all required factors are verified.
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+$
            example: a11b868cbba3cd8056ce6adb44d46a11a113170e884509c179701270b97cf16f
            nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/requestLoginPostUnlock"
      responses:
        "200":
          description: The response includes overall authentication status (isUnlocked)
            and status of each authentication factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseLoginUnlock"
        "400":
          description: Incorrect request properties were specified.
        "401":
          description: Incorrect or missing authentication token was specified.
  /logout:
    get:
      summary: Logout from the Circularo system
      description: >-
        This endpoint invalidates the authentication token.


        When called, this endpoint:

        1. Invalidates the current authentication token (making it unusable for
        future API calls)

        2. Clears the token cookie from the browser

        3. For users authenticated via identity providers (OAuth/SAML), may
        return a URL to complete logout at the provider


        Note: API tokens are not invalidated by this endpoint. To invalidate an
        API key, use the dedicated API endpoint instead.


        For integration purposes: If you're using an API token for system
        integration, do not call this endpoint as part of your regular workflow.


        ---




        **Token authorization:** Authorize using token to call this endpoint.
      operationId: requestLogoutGetLogout
      tags:
        - Logout
      security:
        - Token: []
      responses:
        "200":
          description: Successfully logged out. If the user was authenticated via an
            identity provider (OAuth/SAML), a logout URL may be returned to
            complete the logout process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseLogout"
        "401":
          description: No valid authentication token was provided.
