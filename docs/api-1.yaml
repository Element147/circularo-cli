          example: john.doe@example.com
          nullable: true
        name:
          type: string
          description: Unique username, typically email address.
          example: john.doe@example.com
          nullable: true
        organization:
          type: string
          description: ID of the organization this user belongs to.
          nullable: true
        phone:
          type: string
          description: User's phone number.
          nullable: true
        recordType:
          type: string
          description: Type of user account.
