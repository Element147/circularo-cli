        - type
    requestSharesPostReminder:
      type: object
      properties:
        documentId:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: ID of a document to send reminders for. When provided, reminders
            will be sent to all eligible recipients who have pending actions for
            this document.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
          nullable: true
        reminderType:
          type: string
          description: Type of share reminder to send. Defaults to 'email'. Valid values
            are 'email' and 'sms'. This determines the method of notification
            sent to recipients.
          enum:
            - null
            - email
            - sms
          example: email
          default: email
          nullable: true
    requestSharesPostShare:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsAnnotation"
          description: Array of text annotations to be added to the document. Each
            annotation defines text content, position, formatting, and other
            properties.
        data:
          type: array
          items:
            $ref: "#/components/schemas/requestSharesShareData"
          minItems: 1
          maxItems: 100
          description: Array of share configurations, one for each recipient. Each
            configuration defines who receives the document, what they can do
            with it, and any security settings for their access.
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to share. This ID is returned
            when creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document. Each image entry
            defines the image content (as a file hash), position, and other
            properties.
        message:
          type: string
          maxLength: 2000
          description: Optional message to include with the share notification. This
            message will be sent to all recipients.
          example: New client agreement to sign.
          nullable: true
        objectType:
          type: string
          description: Type of object being shared. Currently, only "document" is supported.
          enum:
            - document
        sequential:
          type: boolean
          description: When set to true, action-requiring shares (sign, approve, etc.)
            must be completed in sequence based on the order specified in each
            share configuration. When false, all recipients can act in parallel.
        signatureFields:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignatureFields"
          description: Array of signature fields to add to the document. These define
            where signatures should be placed by the recipients. Only applicable
            when sharing for signing purposes.
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignature"
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties.
        type:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          maxLength: 100
          description: Document metadata definition identifier. This must match the
            metadata definition identifier of the document being shared.
          example: d_default
      required:
        - data
        - id
        - objectType
        - type
    requestSharesPostSignStartDigest:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestSharesSignatureAnnotation"
          description: Array of text annotations to be added to the document alongside
            signatures. Each annotation defines text content, position,
            formatting, and other properties.
        certificateHash:
          type: string
          pattern: ^[a-z0-9]+$
          minLength: 1
          description: Certificate file to use for signing (must be stored in user object).
          example: s1pss1atbzli272pinbt48n2ssy96ax2pwgqrz5qyzklwxg1kl0tq6anvz1p97xj
        digestAlgorithm:
          type: string
          description: Optional digest algorithm to use for the document. If not provided,
            the default algorithm (SHA-256) will be used.
          enum:
            - SHA-256
            - SHA-512
          example: SHA-256
          default: SHA-256
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document alongside
            signatures. Each image entry defines the image content (as a file
            hash), position, and other properties.
        signatureProvider:
          type: string
          description: Name of the signature provider to use for the signing process.
          enum:
            - internalUsb
            - internalNfc
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestSharesSignatureData"
          minItems: 1
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties
      required:
        - signatureProvider
        - signatures
    requestSharesPostSignStartFile:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestSharesSignatureAnnotation"
          description: Array of text annotations to be added to the document alongside
            signatures. Each annotation defines text content, position,
            formatting, and other properties.
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document alongside
            signatures. Each image entry defines the image content (as a file
            hash), position, and other properties.
        signatureProvider:
          type: string
          description: Name of the signature provider to use for the signing process.
          enum:
            - internalUsb
            - internalNfc
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestSharesSignatureData"
          minItems: 1
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties
      required:
        - signatureProvider
        - signatures
    requestSharesPutDisableShare:
      type: object
      properties:
        message:
          type: string
          minLength: 0
