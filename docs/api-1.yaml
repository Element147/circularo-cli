            - annotation_datetime
            - annotation_datetime_current
            - annotation_date_current
            - docId
            - annotation_dropdown
            - annotation_submitted_file
            - annotation_full_name
            - annotation_generic
            - annotation_link
            - annotation_mail
            - annotation_metadata
            - annotation_phone
            - annotation_radio
            - annotation_role
          nullable: true
        text:
          type: string
          description: Text content of the annotation.
        zIndex:
          type: integer
          description: z-index of element.
          nullable: true
    requestDocumentsBodyCreate:
      type: object
      properties:
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/entityGenericCustomField"
          maxItems: 100
          description: Custom fields attached to the document (max 10 KiB).
          nullable: true
        customTemplate:
          type: string
          description: Identifier of the custom template, if used.
          nullable: true
        documentCategory:
          type: string
          description: Category of the document. This should be one the values configured
            in settings.
          example: Contract
          nullable: true
        documentTitle:
          type: string
          description: Title of the document.
          example: Contract Agreement
          nullable: true
        documentType:
          type: string
          description: Document metadata definition. This determines the document's
            structure and available fields. Must be a valid metadata document
            template defined in the system.
          example: d_default
          nullable: true
        file:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsBodyFile"
          description: Array of files to be attached to this document.
        pdfFile:
          allOf:
            - $ref: "#/components/schemas/requestDocumentsBodyPdfFile"
          description: Main file of the document, this is the file that is displayed in
            the UI. It doesn't have to be in PDF format!
        submittedFiles:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsBodySubmittedFile"
          description: Array of files to be submitted to this document.
      required:
        - documentTitle
        - documentType
    requestDocumentsBodyFile:
      type: object
      properties:
        content:
          type: string
          description: File ID (hash).
          example: as0ia4jdqecwq0u5s1omd9krs4u244ic2n2545kyhyat9imkwyg1bgec16r94tth
        name:
          type: string
          description: File name.
          example: LegalNotes.docx
          nullable: true
        public:
          type: boolean
          description: Is this attachment public?.
      required:
        - content
    requestDocumentsBodyPdfFile:
      type: object
      properties:
        content:
          type: string
          description: File ID (hash).
          example: a219a47b4f5b1xv726cfm36l8k1hkxzwmj5mszvfq6szoambdvc44v6i8hrhntv0
        name:
          type: string
          description: File name.
          example: Contract.pdf
          nullable: true
      required:
        - content
    requestDocumentsBodySubmittedFile:
      type: object
      properties:
        content:
          type: string
          description: Submitted file ID (hash).
          example: as0ia4jdqecwq0u5s1omd9krs4u244ic2n2545kyhyat9imkwyg1bgec16r94tth
        name:
          type: string
          description: Submitted file name.
          example: IDCardFront.pdf
          nullable: true
        public:
          type: boolean
          description: Is this submitted file public?
      required:
        - content
    requestDocumentsDeleteBulk:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/requestGenericIdVersion"
          minItems: 1
          maxItems: 100
          description: Array of document objects to delete.
      required:
        - documents
    requestDocumentsImageData:
      type: object
      properties:
        blob:
          type: string
          minLength: 1
          description: Hash ID of image user wants to use as signature.
          example: da09a47b4f5b1xv726cfm36l8k1hkxzwmj5mszvfq6szoambdvc44v6i8hrhnu1f
        comment:
          type: string
          maxLength: 1500
          description: Comment (optional).
          example: Processed as requested.
          nullable: true
        pages:
          type: array
          items:
            type: integer
            minimum: 1
            exclusiveMinimum: false
            example: 2
          description: Page(s), where image should be (first page = 1).
        position:
          allOf:
            - $ref: "#/components/schemas/requestDocumentsSignatureItem"
          description: Position of signature.
        signee:
          type: string
          description: ID of the person who is adding the image.
        signFieldId:
          type: string
          description: ID of sign field from which data should be taken.
        subtype:
          type: string
          description: Sub type for current field.
          nullable: true
        zIndex:
          type: integer
          description: z-index of element.
          nullable: true
      required:
        - blob
    requestDocumentsOptionalDataCreate:
      type: object
      properties:
        cloneFiles:
          type: boolean
          description: Clone specified attachment files. This is necessary when their IDs
            were already used elsewhere.
          nullable: true
        cloneMainFile:
          type: boolean
          description: Clone main file. This is necessary when its ID was already used
            elsewhere.
          nullable: true
        folder:
          type: string
          description: Folder ID where the document should be placed. If not provided, the
            document will be placed in the root folder.
          example: 8d25c1a9-1ee2c7f56-1da2-00ac83ba54ce
          nullable: true
    requestDocumentsPostDocument:
      type: object
      properties:
        body:
          $ref: "#/components/schemas/requestDocumentsBodyCreate"
        convertToPDF:
          type: boolean
          description: When set to true, the system will attempt to convert the main file
            to PDF format.
        definitionType:
          type: string
          description: Document definition type that determines how the document is
            processed.
          example: ext
        optionalData:
          allOf:
            - $ref: "#/components/schemas/requestDocumentsOptionalDataCreate"
          description: Optional data for advanced document features.
        usePdfA:
          type: boolean
          description: When set to true, PDF files will be converted to PDF/A format,
            which is optimized for long-term archiving. Note that this
            conversion may affect the visual appearance of the document.
          nullable: true
        workflow:
          type: string
          description: Workflow type to apply to the document. This determines the
            document's lifecycle and approval process.
          example: wf_archive
      required:
        - definitionType
        - workflow
    requestDocumentsPostSignStartDigest:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsAnnotation"
          description: Array of text annotations to be added to the document alongside
            signatures. Each annotation defines text content, position,
            formatting, and other properties.
        certificateHash:
          type: string
          pattern: ^[a-z0-9]+$
          minLength: 1
          description: Certificate file to use for signing (must be stored in user object).
          example: s1pss1atbzli272pinbt48n2ssy96ax2pwgqrz5qyzklwxg1kl0tq6anvz1p97xj
        digestAlgorithm:
          type: string
          description: Optional digest algorithm to use for the document. If not provided,
            the default algorithm (SHA-256) will be used.
          enum:
            - SHA-256
            - SHA-512
          example: SHA-256
          default: SHA-256
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to sign. This ID is returned when
            creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document alongside
            signatures. Each image entry defines the image content (as a file
            hash), position, and other properties.
        signatureProvider:
          type: string
          description: Name of the signature provider to use for the signing process.
          enum:
            - internalUsb
            - internalNfc
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignature"
          minItems: 1
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties
      required:
        - id
        - signatureProvider
        - signatures
    requestDocumentsPostSignStartFile:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsAnnotation"
          description: Array of text annotations to be added to the document alongside
            signatures. Each annotation defines text content, position,
            formatting, and other properties.
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to sign. This ID is returned when
            creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document alongside
            signatures. Each image entry defines the image content (as a file
            hash), position, and other properties.
        signatureProvider:
          type: string
          description: Name of the signature provider to use for the signing process.
          enum:
            - internalUsb
            - internalNfc
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignature"
          minItems: 1
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties
      required:
        - id
        - signatureProvider
        - signatures
    requestDocumentsPutAnnotate:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsAnnotation"
          description: Array of text annotations to be added to the document. Each
            annotation defines text content, position, formatting, and other
            properties.
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to annotate. This ID is returned
            when creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document. Each image entry
            defines the image content (as a file hash), position, and other
            properties.
      required:
        - id
    requestDocumentsPutSeal:
      type: object
      properties:
        certificate:
          type: boolean
          description: When set to true, a digital certificate will be applied to the
            document. The certificate cryptographically seals the document,
            providing proof of authenticity and integrity.
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to seal. This ID is returned when
            creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        timestamp:
          type: boolean
          description: When set to true, a trusted timestamp from a Time Stamping
            Authority (TSA) will be added to the document. This provides
            cryptographic proof of when the document was sealed.
      required:
        - id
    requestDocumentsPutSign:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsAnnotation"
          description: Array of text annotations to be added to the document alongside
            signatures. Each annotation defines text content, position,
            formatting, and other properties.
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: Unique identifier of the document to sign. This ID is returned when
            creating documents or listing documents.
          example: a0d01c9d-f72f-4c57-af11-e26bda19cc59
        images:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsImageData"
          description: Array of images to be embedded into the document alongside
            signatures. Each image entry defines the image content (as a file
            hash), position, and other properties.
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignature"
          minItems: 1
          description: Array of signature data to be applied to the document. Each
            signature defines the signature field ID, position, and other
            properties
      required:
        - id
        - signatures
    requestDocumentsPutSignFinishDigest:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier of the document signing session obtained from
            POST /documents/sign/{version}/start/digest endpoint.
          example: a0d01c9df72f4c57af11e26bda19cc59
        signedDigests:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignedDigest"
          minItems: 1
          description: Array of signed digest and original digests.
      required:
        - sessionId
        - signedDigests
    requestDocumentsPutSignFinishFile:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier of the document signing session obtained from
            POST /documents/sign/{version}/start/file endpoint.
          example: a0d01c9df72f4c57af11e26bda19cc59
        signedFiles:
          type: array
          items:
            $ref: "#/components/schemas/requestDocumentsSignedFile"
          minItems: 1
          description: Array of signed files and original files.
      required:
        - sessionId
        - signedFiles
    requestDocumentsSignature:
      type: object
      properties:
        blob:
          type: string
          minLength: 1
          description: Hash ID of image user wants to use as signature or stamp ID in case
            of stamp.
          example: da09a47b4f5b1xv726cfm36l8k1hkxzwmj5mszvfq6szoambdvc44v6i8hrhnu1f
        comment:
          type: string
          maxLength: 1500
          description: Comment (optional).
          example: Processed as requested.
          nullable: true
        decorationType:
          type: string
          description: Specified decoration type.
          example: empty
          default: empty
          nullable: true
        pages:
          type: array
          items:
            type: integer
            minimum: 1
            exclusiveMinimum: false
          description: Page(s), where signature should be (first page = 1).
        position:
          allOf:
            - $ref: "#/components/schemas/requestDocumentsSignatureItem"
          description: Position of signature.
        signee:
          type: string
          description: ID of the person who is signing the document.
        signFieldId:
          type: string
          description: ID of sign field from which data should be taken.
        signOnBehalfOf:
          type: string
          pattern: ^[A-Za-z0-9.@_-]+$
          description: Username on whose behalf was this signed.
          example: john.doe@example.com
          nullable: true
        timestamp:
          type: boolean
          description: Should this sign be timestamped? (visual only).
        type:
          type: string
          description: Type of signature valid values.
          enum:
            - signature
            - initials
            - stamp
            - wacom
            - organization_stamp
      required:
        - blob
    requestDocumentsSignatureFields:
      type: object
      properties:
        align:
          type: string
          description: Text align on line (left/center/right).
          enum:
            - left
            - center
            - right
          example: left
          default: left
        backgroundColor:
          type: string
          pattern: ^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
          description: Color to use for annotation background.
          example: "#ffaa55"
          nullable: true
        bold:
          type: boolean
          description: Flag, is this this should be bold.
        color:
          type: string
          pattern: ^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$
          description: Hex color of font to be used
          example: "#ffaa55"
          default: "#000000"
          nullable: true
        font:
          type: string
          description: Font to use for this annotation.
          nullable: true
        fontSize:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Size of font to be used for annotation
          example: 11
          default: 11
        id:
          type: string
          description: Id
        order:
          type: integer
          description: Sign order
        pages:
          type: array
          items:
            type: integer
            minimum: 1
            exclusiveMinimum: false
          minItems: 1
          description: Array of pages where sign field should be placed.
        position:
          allOf:
            - $ref: "#/components/schemas/requestDocumentsSignatureItem"
          description: Element position
        readOnly:
          type: boolean
          description: Read-only field ensures the user cannot change the preset
            annotation text.
          nullable: true
        required:
          type: boolean
          description: Is this field required
        subtype:
          type: string
          description: Annotation subtype.
          nullable: true
        text:
          type: string
          description: Annotation text.
        timestamp:
          type: boolean
          description: Should timestamp be used
        tooltip:
          type: string
          description: Tooltip text
          nullable: true
        type:
          type: string
          description: signature/initials/annotation/image/...
          enum:
            - annotation
            - image
            - initials
            - organization_stamp
            - signature
            - stamp
            - wacom
        user:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9.@_-]+$
            minLength: 1
            description: Username that uniquely identifies a user in the system. Usually an
              email address.
            example: john.doe@example.com
          description: User(s), who should sign this field. Required if subtype is not
            "docId" or usage is not autosign/extracted.
        zIndex:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          description: z-index of element
          nullable: true
      required:
        - pages
        - position
        - type
    requestDocumentsSignatureItem:
      type: object
      properties:
        percentHeight:
          type: number
          minimum: 0
          exclusiveMinimum: false
          maximum: 1
          exclusiveMaximum: false
          description: Height which signature should have in document expressed as ratio
            to page height.
          example: 0.07
        percentWidth:
          type: number
          minimum: 0
          exclusiveMinimum: false
          maximum: 1
          exclusiveMaximum: false
          description: Width which signature should have in document expressed as ratio to
            page width.
          example: 0.2
        percentX:
          type: number
          minimum: 0
          exclusiveMinimum: false
          maximum: 1
          exclusiveMaximum: false
          description: X-coord of top left corner of signature image expressed as ratio to
            page width.
          example: 0.15
        percentY:
          type: number
          minimum: 0
          exclusiveMinimum: false
          maximum: 1
          exclusiveMaximum: false
          description: Y-coord of top left corner of signature image expressed as ratio to
            page height.
          example: 0.3
      required:
        - percentHeight
        - percentWidth
        - percentX
        - percentY
    requestDocumentsSignedDigest:
      type: object
      properties:
        originalDigest:
          type: string
          description: Original unsigned file provided in POST
            /documents/sign/{version}/start/file endpoint.
          example: ii6ym1h06cdujxq71wn167xeto2qrnwc2n637ns5f8f9ip94utbj2j02qs9qlh3n
        signedDigest:
          type: string
          description: Signed file.
          example: 7za4k1pv1g0k3r9bdyatfcpflnttvaloqnsc00gyw2x5tnhxbbrzbc4xjpdzy2sl
      required:
        - originalDigest
        - signedDigest
    requestDocumentsSignedFile:
      type: object
      properties:
        originalFile:
          type: string
          description: Original unsigned file digest provided in POST
            /documents/sign/{version}/start/digest endpoint.
          example: 3bb12eda3c298db5de25597f54d924f2e17e78a26ad8953ed8218ee682f0bbbe9021e2f3009d152c911bf1f25ec683a902714166767afbd8e5bd0fb0124ecb8a
        signedFile:
          type: string
          description: Signed hash.
          example: 16732f93c1c44a746035fc19585734e323afd49070b4bd5ac9d0d60ce1ee5d4fdd16a039a435d680a6d068c33800b7cc4b6599720ca38617d38f0602326cd445
      required:
        - originalFile
        - signedFile
    requestExportPostExport:
      type: object
      properties:
        exporterName:
          type: string
          minLength: 1
          description: Name of the exporter to use. This must match one of the exporter
            names returned by the GET /export endpoint. Different exporters
            produce different output formats and support different options.
          example: pdf
        options:
          type: object
          additionalProperties: false
          description: Exporter-specific options that customize the export behavior. The
            available options depend on the selected exporter and can be found
            in the exporter's configuration returned by the GET /export
            endpoint.
          example:
            includeAuditTrail: true
            combineFiles: false
        query:
          allOf:
            - $ref: "#/components/schemas/requestGenericDocumentSearchUnlimited"
          description: Elasticsearch query object that defines which documents to export.
            This allows filtering documents by various criteria such as document
            type, date range, status, and more.
      required:
        - exporterName
        - query
    requestFilesPostFile:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The file to upload. Must be provided as multipart/form-data. The
            system supports various file formats including PDF, Office
            documents, images, and more.
        fileName:
          type: string
          description: Custom name for the file in the system. If not provided, the
            original filename will be used. Name should be without file
            extension, which will be taken from file.
          example: Agreement_2023
          nullable: true
        public:
          type: boolean
          description: When set to true, the file will be accessible without
            authentication via a public URL.
          nullable: true
        signatureAnchors:
          type: array
          items:
            $ref: "#/components/schemas/requestGenericSignatureAnchor"
          maxItems: 100
          description: Text anchors to be searched in the document for signature
            positioning. Each anchor defines text to search for and parameters
            for signature placement relative to that text.
        usePdfA:
          type: boolean
          description: When set to true, PDF files will be converted to PDF/A format,
            which is optimized for long-term archiving. Note that this
            conversion may affect the visual appearance of the document.
          nullable: true
    requestFoldersDeleteFolder:
      type: object
      properties:
        folderIds:
          type: array
          items:
            type: string
          description: Array of folder IDs to delete.
    requestFoldersPostFolder:
      type: object
      properties:
        isShared:
          type: boolean
          description: Determines whether the folder should be created in the shared
            folder structure (true) or in your personal folder structure
            (false). Note that you cannot create a shared folder inside a
            personal folder or vice versa.
          example: true
        name:
          type: string
          description: Name for the new folder. This will be displayed in the folder tree.
          example: Project Documents
        parentFolderId:
          type: string
          description: ID of the parent folder where this new folder should be created. If
            not provided, the folder will be created at the root level.
          example: a6cb590d-00c5-4a38-86da-da506ebb64df
          nullable: true
      required:
        - name
    requestFoldersPutToFolder:
      type: object
      properties:
        docs:
          type: array
          items:
            $ref: "#/components/schemas/requestGenericId"
          minItems: 1
          maxItems: 1000
          description: Array of documents and folders to be moved. Each item must include
            an ID and optionally a version number. The system will verify that
            you have permission to move each item.
        folderId:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          description: ID of the destination folder where the items should be moved. If
            set to null, items will be moved to the root level of either your
            personal folder structure or the shared folder structure (depending
            on the isShared parameter).
          example: 97cfb9de-92dd-413a-b5e7-175eff7506d6
          nullable: true
        isShared:
          type: boolean
          description: Indicates whether the destination is in the shared folder structure
            (true) or your personal folder structure (false).
          example: true
        rightsMode:
          type: string
          description: Add or do not modify rights from the destination folder. Only
            usable when isShared is true.
          enum:
            - add
            - noop
          example: add
          default: add
      required:
        - docs
    requestGenericDocumentSearch:
      type: object
      properties:
        allowFolders:
          type: boolean
          description: Allow also folders to be returned, or only documents.
        esFilters:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: false
            - type: object
              additionalProperties: false
          description: ES default filters for complicated filtering.
        esQuery:
          type: array
          items:
            type: object
            additionalProperties: false
          description: Elasticsearch queries for more complicated querying.
        folder:
          allOf:
            - $ref: "#/components/schemas/requestSearchDocumentsFolder"
          description: Folder search filters.
        from:
          type: integer
        inbox:
          type: boolean
          description: Inbox only.
        limit:
          type: integer
          description: Page limit.
        page:
          type: integer
          description: Page index.
        scroll:
          allOf:
            - $ref: "#/components/schemas/requestGenericSearchScroll"
          description: Pagination parameters for retrieving large sets of documents.
            Always close the scroll context after you are done with it.
        size:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          maximum: 100
          exclusiveMaximum: false
          example: 10
          default: 10
        sort:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: false
            - type: object
              additionalProperties: false
          description: Sort results; Elasticsearch format.
        trash:
          type: boolean
          description: When set to true, returns documents in the user's trash.
        type:
          type: string
          description: Document metadata definition.
          example: d_default
        workflow:
          type: string
          description: Workflow type.
