name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Configure Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and Test (Fat JAR)
        shell: bash
        run: ./gradlew build

      - name: Build Native Image
        shell: bash
        run: ./gradlew nativeCompile

      - name: Upload JAR Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: circularo-cli-jar
          path: build/libs/*-SNAPSHOT.jar

      - name: Upload Native Executable
        uses: actions/upload-artifact@v4
        with:
          name: circularo-cli-native-${{ matrix.os }}
          path: |
            build/native/nativeCompile/circularocli
            build/native/nativeCompile/circularocli.exe

      - name: Stop Gradle Daemon
        if: always()
        shell: bash
        run: ./gradlew --stop
